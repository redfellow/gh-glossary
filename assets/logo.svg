<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>gh-glossary</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231a5c"/>
      <stop offset="1" stop-color="#0a2a3d"/>
    </linearGradient>
    <radialGradient id="tile-light" cx="22%" cy="12%" r="75%">
      <stop offset="0" stop-color="#7c6cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#d08bff"/>
    </linearGradient>
    <linearGradient id="line-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <linearGradient id="line-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe0b0"/>
      <stop offset="1" stop-color="#4fb8ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset=".45" stop-color="#ffd25e"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#02040c" flood-opacity=".5"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect width="128" height="128" rx="28" fill="url(#tile-light)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>

  <!-- lines of text, shortening toward the highlighted term -->
  <g class="lines" filter="url(#shadow)">
    <rect x="22" y="30" width="84" height="16" rx="8" fill="url(#line-1)"/>
    <rect x="22" y="56" width="64" height="16" rx="8" fill="url(#line-2)"/>
    <rect x="22" y="82" width="40" height="16" rx="8" fill="url(#line-3)"/>
  </g>
  <g fill="url(#sheen)">
    <rect x="22" y="30" width="84" height="16" rx="8"/>
    <rect x="22" y="56" width="64" height="16" rx="8"/>
    <rect x="22" y="82" width="40" height="16" rx="8"/>
  </g>

  <!-- the term that gets a definition -->
  <circle class="spark" cx="85" cy="90" r="9.5" fill="url(#spark)" filter="url(#glow)"/>
</svg>
