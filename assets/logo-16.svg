<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- logo.svg drawn for 16 px: every edge on a whole pixel, no shadow or glow -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f6b"/>
      <stop offset="1" stop-color="#0a2a3d"/>
    </linearGradient>
    <linearGradient id="line-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a8cff"/>
      <stop offset="1" stop-color="#d89cff"/>
    </linearGradient>
    <linearGradient id="line-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa6ff"/>
      <stop offset="1" stop-color="#9a8cff"/>
    </linearGradient>
    <linearGradient id="line-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ae8b8"/>
      <stop offset="1" stop-color="#5ac0ff"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#tile)"/>
  <rect class="line" x="3" y="3" width="10" height="2" rx="1" fill="url(#line-1)"/>
  <rect class="line" x="3" y="7" width="8" height="2" rx="1" fill="url(#line-2)"/>
  <rect class="line" x="3" y="11" width="5" height="2" rx="1" fill="url(#line-3)"/>
  <circle class="spark" cx="11" cy="12" r="1.8" fill="#ffc53d"/>
</svg>
